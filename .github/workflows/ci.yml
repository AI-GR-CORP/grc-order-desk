name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Prepare test database (migrations on plain Postgres)
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -c 'create database grc_test'
          psql -h localhost -U postgres -d grc_test -v ON_ERROR_STOP=1 -f supabase/tests/supabase-stubs.sql
          for f in supabase/migrations/*.sql; do psql -h localhost -U postgres -d grc_test -v ON_ERROR_STOP=1 -f "$f"; done
      - run: pnpm test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/grc_test
      - run: pnpm --filter @grc/worker build
      - run: pnpm --filter @grc/web build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci
          NEXT_TELEMETRY_DISABLED: 1
